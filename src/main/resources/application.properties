spring.application.name=curehub
server.port=8086
# P0 guardrail: bind loopback only for localhost demo — never 0.0.0.0 with real PHI.
server.address=127.0.0.1
# NOTE: spring.jpa.open-in-view stays default (true) for demo compat — lazy
# relations serialise in REST responses. Prod sets it false (see
# application-prod.properties) once DTOs/join-fetch cover all reads.

# Default dev DB: H2 in-memory (zero setup). Same JPA model runs on MySQL in prod.
spring.datasource.url=jdbc:h2:mem:central_hub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# P0: H2 console is DEV-ONLY (blank sa password). Keep false by default; enable
# only for local demo via -Dspring.h2.console.enabled=true (localhost only).
# Prod profile must keep this false and use MySQL + vault password + ddl-auto=validate.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ---- MySQL profile (prod): uncomment to use a real central MySQL instead of H2 ----
